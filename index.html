<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<main class="hub">

      <div class="hub-card-overlay">
        <span class="hub-card-badge">Próximamente</span>
        <h2>Hostal Oasis Cobija</h2>
        <p>Dirección próximamente</p>
      </div>
    </div>

    <div class="hub-card hub-card-pending">
      <div class="hub-card-overlay">
        <span class="hub-card-badge">Próximamente</span>
