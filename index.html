<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hostales Oasis</title>
<meta name="description" content="Elige el Hostal Oasis al que quieres ingresar: Atacama, Cobija o Centro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="hub">
  <div class="hub-intro">
    <p class="eyebrow">Grupo Oasis</p>
    <h1>Hostales Oasis</h1>
    <p class="hub-lead">Elige el hostal al que quieres ingresar.</p>
  </div>

  <div class="hub-grid">
    <div class="hub-item">
      <a class="hub-card" href="https://patriciopastencruz.github.io/hostal-oasis-atacama/">
        <div class="hub-collage">
          <div class="hub-collage-large" style="background-image:url('images/hostal-oasis-atacama.PNG')"></div>
          <div class="hub-collage-small" style="background-image:url('images/pieza-2.PNG')"></div>
          <div class="hub-collage-small" style="background-image:url('images/pieza-3.PNG')"></div>
          <div class="hub-collage-small" style="background-image:url('images/pieza-4.PNG')"></div>
          <div class="hub-collage-small" style="background-image:url('images/cocina.PNG')"></div>
        </div>
        <div class="hub-card-overlay">
          <h2>Hostal Oasis Atacama</h2>
          <p>Uruguay 2462, Calama, Chile</p>
          <span class="hub-card-cta">Ingresar</span>
        </div>
      </a>
      <iframe class="hub-map" title="Ubicación Hostal Oasis Atacama"
        src="https://maps.google.com/maps?q=Uruguay%202462%2C%20Calama%2C%20Chile&t=&z=15&ie=UTF8&iwloc=&output=embed"
        loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <div class="hub-item">
      <div class="hub-card hub-card-pending">
        <div class="hub-card-overlay">
          <span class="hub-card-badge">Próximamente</span>
          <h2>Hostal Oasis Cobija</h2>
          <p>Cobija 3211, Calama, Chile</p>
        </div>
      </div>
      <iframe class="hub-map" title="Ubicación Hostal Oasis Cobija"
        src="https://maps.google.com/maps?q=Cobija%203211%2C%20Calama%2C%20Chile&t=&z=15&ie=UTF8&iwloc=&output=embed"
        loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <div class="hub-item">
      <div class="hub-card hub-card-pending">
        <div class="hub-card-overlay">
          <span class="hub-card-badge">Próximamente</span>
          <h2>Hostal Oasis Centro</h2>
          <p>Antofagasta 2183, Calama, Chile</p>
        </div>
      </div>
      <iframe class="hub-map" title="Ubicación Hostal Oasis Centro"
        src="https://maps.google.com/maps?q=Antofagasta%202183%2C%20Calama%2C%20Chile&t=&z=15&ie=UTF8&iwloc=&output=embed"
        loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>
</main>

</body>
</html>
